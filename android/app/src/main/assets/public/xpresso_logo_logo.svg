<svg xmlns="http://www.w3.org/2000/svg" viewBox="198 250 910 720" width="910" height="720" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700&amp;display=swap');
      .wordmark {
        font-family: 'Nunito', 'Varela Round', 'Quicksand', 'Helvetica Neue', Arial, sans-serif;
        font-weight: 700;
        font-size: 222px;
        fill: #2B2B2B;
      }
    </style>
  </defs>

  <!-- Speech bubble: single flat shape (circle + tail) -->
  <path id="bubble" transform="translate(11,0)"
        d="M456 611 L444 694 L539 686 A222 222 0 1 0 456 611 Z"
        fill="#0050D8" stroke="#0050D8" stroke-width="14" stroke-linejoin="round"/>

  <!-- x -->
  <g id="x" transform="translate(-1,6)" stroke="#FFFFFF" stroke-width="40" stroke-linecap="round" fill="none">
    <line x1="548" y1="438" x2="668" y2="584"/>
    <line x1="668" y1="438" x2="548" y2="584"/>
  </g>

  <!-- superscript 2 -->
  <path id="two" transform="translate(-1,6)"
        d="M713 396 C714 383 726 377 741 377 C758 377 769 387 769 400 C769 416 748 430 714 463 L768 463"
        stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Wordmark (Nunito Bold) -->
  <text id="wordmark" class="wordmark" x="653" y="903" text-anchor="middle">xpresso</text>
</svg>
