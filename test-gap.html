<!DOCTYPE html>
<html>
<head>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Kalam:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  .math-fraction {
    display: inline-block;
    vertical-align: baseline;
    margin: 0 0.2em;
    line-height: 1;
    text-align: center;
  }
  .numerator {
    display: block;
    border-bottom: 2px solid currentColor;
    padding-bottom: 3px;
  }
  .numerator-inner {
    display: inline-flex;
    align-items: baseline;
    justify-content: center;
    line-height: 1;
    padding: 0 0.1em;
  }
  .denominator {
    display: block;
    padding-top: 1px;
  }
  .denominator-inner {
    display: inline-flex;
    align-items: baseline;
    justify-content: center;
    line-height: 1;
    padding: 0 0.1em;
  }
  body { font-size: 40px; font-family: 'Kalam', cursive; }
  .test-container { margin: 50px; border-bottom: 1px solid rgba(0,0,0,0.2); }
</style>
</head>
<body>
  <div class="test-container">
    Normal text <span class="math-fraction">
      <span class="numerator"><span class="numerator-inner">5</span></span>
      <span class="denominator"><span class="denominator-inner">555</span></span>
    </span> with fraction.
  </div>
</body>
</html>
