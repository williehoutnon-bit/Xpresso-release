name: Build Android APK

on:
  workflow_dispatch: # This enables the manual "Run workflow" button

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL || 'https://oujijpepbkqpgzgegoqf.supabase.co' }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL || 'https://oujijpepbkqpgzgegoqf.supabase.co' }}
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PUBLIC_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || secrets.PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          VITE_BUNDLE_VERSION: 1.0.${{ github.run_number }}
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Validate Live Update publishers
        run: |
          node --check scripts/publish-live-update.mjs
          node --check scripts/publish-apk.mjs

      - name: Publish Live Update to Supabase
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL || secrets.PUBLIC_SUPABASE_URL || 'https://oujijpepbkqpgzgegoqf.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.VITE_SUPABASE_SERVICE_KEY || secrets.SUPABASE_SERVICE_KEY || secrets.VITE_SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_SERVICE_KEY: ${{ secrets.VITE_SUPABASE_SERVICE_KEY }}
          BUNDLE_VERSION: 1.0.${{ github.run_number }}
        run: |
          TARGET_KEY="${SUPABASE_SERVICE_ROLE_KEY:-$VITE_SUPABASE_SERVICE_KEY}"
          if [ -z "$TARGET_KEY" ]; then
            echo "::error::Required Supabase service-role key is missing; refusing to skip live-update publishing."
            exit 1
          fi
          if [ ! -d dist ] || [ -z "$(find dist -type f -print -quit)" ]; then
            echo "::error::No built files found in dist; refusing to publish an empty bundle."
            exit 1
          fi
          (cd dist && zip -qr ../bundle.zip .)
          if [ ! -s bundle.zip ]; then
            echo "::error::Bundle ZIP was not created or is empty."
            exit 1
          fi
          # Lowest installed APK that can run this bundle; bump android/min-native-version.txt whenever
          # the JS starts depending on new native (Java) code.
          export MIN_NATIVE_VERSION="$(tr -d ' \r\n' < android/min-native-version.txt)"
          node scripts/publish-live-update.mjs

      - name: Setup Google Services for FCM
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '\r\n ' | base64 -d > android/app/google-services.json
            echo "google-services.json decoded from base64"
          elif [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "google-services.json populated from secret"
          fi

      - name: Decode Keystore for Release Signing
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > android/app/release.keystore
          echo "Keystore decoded successfully"

      - name: Build Android APKs
        working-directory: android
        env:
          # Same number as the web bundle (1.0.N): Android only accepts an APK update with a higher versionCode.
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          echo "Building Debug APK..."
          ./gradlew assembleDebug --no-daemon

          if [ ! -f "app/release.keystore" ]; then
            echo "No keystore detected. Only Debug APK will be packaged."
            exit 0
          fi

          # Secrets pasted into GitHub often carry trailing newlines/CR that break keystore auth.
          export KEYSTORE_PASSWORD="$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n')"
          export KEY_PASSWORD="$(printf '%s' "${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" | tr -d '\r\n')"
          export KEY_ALIAS="$(printf '%s' "$KEY_ALIAS" | tr -d '\r\n')"

          if ! keytool -list -keystore app/release.keystore -storepass "$KEYSTORE_PASSWORD" > /dev/null 2>&1; then
            echo "::warning::KEYSTORE_PASSWORD does not match the keystore in KEYSTORE_BASE64. Skipping signed release build."
            exit 0
          fi

          if ! keytool -list -keystore app/release.keystore -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::warning::KEY_ALIAS '$KEY_ALIAS' not found in keystore. Available aliases:"
            keytool -list -keystore app/release.keystore -storepass "$KEYSTORE_PASSWORD" | grep -i "PrivateKeyEntry" || true
            echo "Skipping signed release build."
            exit 0
          fi

          echo "Keystore credentials verified. Building Signed Release APK..."
          KEYSTORE_PATH="release.keystore" ./gradlew assembleRelease --no-daemon

      # Only the SIGNED release APK can replace an installed release build (debug builds use a different,
      # per-runner key), so a debug-only run publishes no APK.
      - name: Publish APK for in-app updates
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL || secrets.PUBLIC_SUPABASE_URL || 'https://oujijpepbkqpgzgegoqf.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.VITE_SUPABASE_SERVICE_KEY || secrets.SUPABASE_SERVICE_KEY || secrets.VITE_SUPABASE_SERVICE_ROLE_KEY }}
          BUNDLE_VERSION: 1.0.${{ github.run_number }}
          VERSION_CODE: ${{ github.run_number }}
          APK_PATH: android/app/build/outputs/apk/release/app-release.apk
        run: |
          if [ -f "$APK_PATH" ]; then
            node scripts/publish-apk.mjs
          else
            echo "::warning::No signed release APK was built (keystore secrets missing or invalid); skipping in-app APK publish."
          fi

      - name: Upload Testing APKs
        uses: actions/upload-artifact@v4
        with:
          name: xpresso-apks
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
