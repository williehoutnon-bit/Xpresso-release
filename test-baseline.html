<!DOCTYPE html>
<html>
<head>
<style>
.math-fraction {
  display: inline-block;
  vertical-align: baseline;
  margin: 0 0.2em;
  line-height: 1;
}
.numerator {
  display: block;
  border-bottom: 2px solid currentColor;
  padding-bottom: 0.1em;
  text-align: center;
}
.denominator {
  display: block;
  padding-top: 0.1em;
  text-align: center;
}
body { font-size: 24px; font-family: sans-serif; }
</style>
</head>
<body>
  Normal text
  <span class="math-fraction">
    <span class="numerator">numerator</span>
    <span class="denominator">denominator</span>
  </span>
  more text.
</body>
</html>
